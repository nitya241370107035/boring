events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Standard Apache/Nginx Combined Log Format compatible with SentinelLog pipeline
    log_format combined_sentinel '$remote_addr - $remote_user [$time_local] '
                                 '"$request" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log combined_sentinel;
    error_log  /var/log/nginx/error.log warn;

    upstream dvwa_backend {
        server dvwa:80;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://dvwa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
