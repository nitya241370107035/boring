# SentinelLog Web Detection Signatures
# Mapped to OWASP Top 10 (2021) and MITRE ATT&CK Framework

rules:
  - id: WEB-SQLI-001
    name: SQL Injection Attempt
    label: sqli
    severity: 80
    owasp: "A03:2021-Injection"
    mitre: "T1190"
    target: decoded_url
    regex: "(?i)(\\bunion\\b.+?\\bselect\\b|'\\s*or\\s*1\\s*=\\s*1|information_schema|sleep\\(\\d+\\)|benchmark\\(|xp_cmdshell|--|/\\*)"
    description: "Detects classic boolean-based, union-based, and error-based SQL injection patterns."

  - id: WEB-TRAV-001
    name: Directory Traversal
    label: path_traversal
    severity: 75
    owasp: "A01:2021-Broken Access Control"
    mitre: "T1083"
    target: decoded_url
    regex: "(?i)(\\.\\./|\\.\\.\\\\|%2e%2e|/etc/passwd|win\\.ini|boot\\.ini|windows/win\\.ini)"
    description: "Detects directory escape sequences attempting unauthorized filesystem traversal."

  - id: WEB-XSS-001
    name: Cross-Site Scripting (XSS)
    label: xss
    severity: 70
    owasp: "A03:2021-Injection"
    mitre: "T1189"
    target: decoded_url
    regex: "(?i)(<script.*?>|javascript:|onerror\\s*=|onload\\s*=|alert\\(|document\\.cookie|<svg/onload)"
    description: "Detects client-side script injection patterns in request URL or parameters."

  - id: WEB-CMD-001
    name: OS Command Injection
    label: cmd_injection
    severity: 85
    owasp: "A03:2021-Injection"
    mitre: "T1059"
    target: decoded_url
    regex: "(?i)(;\\s*(cat|ls|dir|whoami|net\\s+user)|\\|\\s*whoami|&&\\s*id|`.*?`|\\$\\((cat|whoami|id).*?\\)|/bin/sh|/bin/bash)"
    description: "Detects command chaining operators and common binary executions."

  - id: WEB-SCAN-UA-001
    name: Known Security Scanner User-Agent
    label: scanner
    severity: 60
    owasp: "A07:2021-Identification and Authentication Failures"
    mitre: "T1595"
    target: ua
    regex: "(?i)(sqlmap|nikto|nmap|gobuster|dirbuster|wpscan|masscan|hydra|acunetix|nessus)"
    description: "Identifies requests generated by automated vulnerability assessment and scanning tools."

  - id: WEB-PROBE-001
    name: Sensitive Resource / Config Probing
    label: sensitive_probe
    severity: 65
    owasp: "A05:2021-Security Misconfiguration"
    mitre: "T1595"
    target: decoded_url
    regex: "(?i)(/\\.env|/\\.git/|/wp-config\\.php|/phpmyadmin|/server-status|backup\\.(zip|tar|sql|gz)|web\\.config)"
    description: "Detects scans looking for configuration files, version control metadata, and admin consoles."
