version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: sentinellog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelpass}
      POSTGRES_DB: ${POSTGRES_DB:-sentinellog}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinellog}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sentinellog-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinelpass}@db:5432/${POSTGRES_DB:-sentinellog}
      API_SECRET_KEY: ${API_SECRET_KEY:-sentinel-secret-key-1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_SUPPRESSION_WINDOW_MINUTES: 10
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models/artifacts:/app/models/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: sentinellog-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SENTINEL_API_URL: http://api:8000
      SENTINEL_API_KEY: ${API_SECRET_KEY:-sentinel-secret-key-1}
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

volumes:
  pgdata:
    driver: local
